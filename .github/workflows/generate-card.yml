name: Generate Profile SVG Card

on:
  schedule:
    - cron: '0 0 * * *' # Läuft täglich um 0:00 UTC
  workflow_dispatch: # Erlaubt manuellen Start im GitHub-Tab "Actions"

permissions:
  contents: write # Wichtig, damit der Bot die generierte Datei committen darf

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch GitHub Org Data & Generate SVG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Daten über die GitHub API für die Org abrufen
          API_URL="https://api.github.com/orgs/peopleandpixel"
          RESPONSE=$(curl -s -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" "$API_URL")
          
          # Werte extrahieren (mit Fallback, falls API limitiert ist)
          REPOS=$(echo "$RESPONSE" | grep -o '"public_repos": [0-9]*' | grep -o '[0-9]*' || echo "0")
          FOLLOWERS=$(echo "$RESPONSE" | grep -o '"followers": [0-9]*' | grep -o '[0-9]*' || echo "0")
          NAME=$(echo "$RESPONSE" | grep -o '"name": "[^"]*"' | head -n 1 | cut -d'"' -f4)
          
          # Falls der Name leer ist, Fallback auf den Org-Namen
          if [ -z "$NAME" ]; then NAME="People & Pixel"; fi

          echo "Found -> Repos: $REPOS, Followers: $FOLLOWERS, Name: $NAME"

          # 2. Eigenes SVG direkt im Skript generieren
          cat <<EOF > profile-card.svg
          <svg width="450" height="180" viewBox="0 0 450 180" fill="none" xmlns="http://www.w3.org/2000/svg">
            <style>
              .bg { fill: #0f172a; rx: 16px; }
              .border { stroke: #334155; stroke-width: 1.5; rx: 16px; }
              .title { fill: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 18px; font-weight: 700; }
              .subtitle { fill: #94a3b8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; }
              .label { fill: #cbd5e1; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; }
              .value { fill: #38bdf8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 600; }
              .badge-bg { fill: #1e293b; rx: 8px; }
            </style>

            <!-- Hintergrund & Rahmen -->
            <rect width="450" height="180" class="bg"/>
            <rect x="0.75" y="0.75" width="448.5" height="178.5" class="border"/>

            <!-- Header -->
            <circle cx="35" cy="35" r="18" fill="#38bdf8" fill-opacity="0.15"/>
            <text x="65" y="32" class="title">$NAME</text>
            <text x="65" y="48" class="subtitle">github.com/peopleandpixel</text>

            <!-- Statistik-Boxen -->
            <g transform="translate(25, 70)">
              <rect width="125" height="75" class="badge-bg"/>
              <text x="15" y="30" class="label">Repositories</text>
              <text x="15" y="55" class="value">$REPOS</text>
            </g>

            <g transform="translate(162.5, 70)">
              <rect width="125" height="75" class="badge-bg"/>
              <text x="15" y="30" class="label">Follower</text>
              <text x="15" y="55" class="value">$FOLLOWERS</text>
            </g>

            <g transform="translate(300, 70)">
              <rect width="125" height="75" class="badge-bg"/>
              <text x="15" y="30" class="label">Status</text>
              <text x="15" y="55" class="value" fill="#4ade80">Aktiv 🚀</text>
            </g>
          </svg>
          EOF
      
      - name: Commit and Push generated SVG
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add profile-card.svg
          git commit -m "chore: auto-update profile svg card stats" || exit 0
          git push
